<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f3ee" />
  <title>Connect 4</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="page">
    <header class="top">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <div><h1>Connect 4<span class="title-dot">.</span></h1></div>
      </div>
      <button type="button" id="copy-link" class="button button-quiet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 13 4-4m-6 6-1 1a4 4 0 0 1-6-6l4-4a4 4 0 0 1 6 0m2 3 1-1a4 4 0 0 1 6 6l-4 4a4 4 0 0 1-6 0" transform="translate(1 1)" /></svg>
        <span id="copy-label">Copy game link</span>
      </button>
    </header>
    <div class="game-layout">
      <section class="game-stage" aria-label="Game" data-player="1">
        <div class="game-topline">
          <div class="turn-status"><span class="turn-dot" aria-hidden="true"></span><p id="status" class="status" aria-live="polite">Red to move</p></div>
          <span id="move-count" class="move-count">Move 1</span>
        </div>
        <div id="solver-alert" class="solver-alert" hidden role="alert">
          <p id="solver-alert-text">The solver failed. Reload to try again.</p>
          <button type="button" id="solver-reload" class="button button-quiet">Reload</button>
        </div>
        <div class="board-wrap">
          <div id="scores" class="scores" aria-label="Column scores" hidden></div>
          <div id="board" class="board" role="grid" aria-label="Connect 4 board"></div>
          <div class="column-keys" aria-hidden="true"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
        </div>
        <div class="game-actions">
          <div class="history-controls" aria-label="Move history">
            <button type="button" id="back" class="button button-history" title="Undo (Z or left arrow)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5-7 7 7 7M3 12h12a6 6 0 0 1 6 6" /></svg>Back
            </button>
            <button type="button" id="forward" class="button button-history" title="Redo (Y or right arrow)">
              Forward<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5 7 7-7 7m6-7H9a6 6 0 0 0-6 6" /></svg>
            </button>
          </div>
          <button type="button" id="new" class="button button-primary">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2 5" /></svg>New game
          </button>
        </div>
        <p class="board-hint">Click a column to drop a disc<span class="keyboard-hint"> · or use keys <kbd>1</kbd>–<kbd>7</kbd></span></p>
      </section>
      <aside class="settings-panel" aria-label="Game settings">
        <div class="panel-heading"><h2>Make it your game</h2><p>Play a friend or take on the computer.</p></div>
        <section class="seats" aria-label="Players">
          <fieldset class="seat" data-player="0">
            <legend><span class="player-disc red" aria-hidden="true"></span>Red<span class="who">Goes first</span></legend>
            <div class="roles" role="radiogroup" aria-label="Red player">
              <label><input type="radio" name="role0" value="human" checked /><span>Human</span></label>
              <label><input type="radio" name="role0" value="easy" /><span>Easy</span></label>
              <label><input type="radio" name="role0" value="medium" /><span>Medium</span></label>
              <label><input type="radio" name="role0" value="perfect" /><span>Perfect</span></label>
            </div>
          </fieldset>
          <fieldset class="seat" data-player="1">
            <legend><span class="player-disc yellow" aria-hidden="true"></span>Yellow<span class="who">Goes second</span></legend>
            <div class="roles" role="radiogroup" aria-label="Yellow player">
              <label><input type="radio" name="role1" value="human" checked /><span>Human</span></label>
              <label><input type="radio" name="role1" value="easy" /><span>Easy</span></label>
              <label><input type="radio" name="role1" value="medium" /><span>Medium</span></label>
              <label><input type="radio" name="role1" value="perfect" /><span>Perfect</span></label>
            </div>
          </fieldset>
        </section>
        <section class="settings-section" aria-label="Game options">
          <label class="toggle-row">
            <span class="toggle-copy"><span class="option-title">Show best moves</span></span>
            <input type="checkbox" id="analyze" class="toggle-input" role="switch" /><span class="toggle-track" aria-hidden="true"></span>
          </label>
          <label class="toggle-row" id="opening-book-option" hidden>
            <span class="toggle-copy"><span class="option-title">Opening book</span><span class="option-description">A head start for the first moves.</span></span>
            <input type="checkbox" id="book" class="toggle-input" role="switch" checked /><span class="toggle-track" aria-hidden="true"></span>
          </label>
        </section>
        <section class="settings-section pace-section" aria-label="Computer timing">
          <div class="range-heading"><label for="delay" class="option-title">Computer pace</label><output id="delay-label" for="delay">400 ms</output></div>
          <input type="range" id="delay" min="0" max="1500" step="50" value="400" style="--range-progress: 26.667%" />
          <div class="range-scale" aria-hidden="true"><span>Quick</span><span>Unhurried</span></div>
          <button type="button" id="pause" class="button button-pause" hidden>Pause</button>
        </section>
      </aside>
    </div>
    <footer id="engine-diagnostics" class="page-footer" hidden>
      <p id="engine-line" class="engine-line" role="status">Getting the solver ready…</p>
      <p id="book-line" class="engine-line" role="status"></p>
    </footer>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
