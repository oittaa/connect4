name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
      - name: Test engine
        run: cargo test --locked -p engine
      - name: Build engine
        run: cargo build --locked -p engine

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked -p engine --all-targets --all-features -- -D warnings
      - name: Clippy WASM
        run: cargo clippy --locked -p engine --target wasm32-unknown-unknown --features wasm --lib -- -D warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install matching wasm-bindgen-cli
        run: |
          version=$(python3 -c "import tomllib; lock=tomllib.load(open('Cargo.lock','rb')); print(next(p['version'] for p in lock['package'] if p['name']=='wasm-bindgen'))")
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Test web
        run: npm test
        working-directory: web
      - name: Build WASM
        run: ./scripts/build-wasm.sh
      - name: Build web
        run: npm run build
        working-directory: web
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Test browser
        run: npm run test:browser
        working-directory: web
